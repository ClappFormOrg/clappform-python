[build-system]
# 1.27 is the first release that emits Metadata 2.4, which the PEP 639
# license expression and license-files fields below require.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "clappform"
# Sourced from __version__ in src/clappform/__init__.py, so a release bumps
# one literal instead of two that can silently disagree. See [tool.hatch.version].
dynamic = ["version"]
description = "Python client for the Clappform gRPC APIs"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Clappform B.V.", email = "info@clappform.com" },
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "grpcio>=1.60,<2",
    # The floor is the gencode version stamped into clappform/gen (5.28.1): an
    # older runtime either lacks google.protobuf.runtime_version entirely (4.x)
    # or fails its own gencode-newer-than-runtime check (5.27 and below). The
    # gencode loads on 6.x and 7.x, and capping below 7 would force pip to
    # backtrack past every grpcio-tools release that ships cp314 wheels.
    "protobuf>=5.28.1,<8",
]

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
polars = ["polars>=1.0"]
arrow = ["pyarrow>=15.0"]
all = ["clappform[pandas,polars,arrow]"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    # 1.75.1 is the oldest release with cp314 wheels. Below it, a Python 3.14
    # runner builds the sdist from source, and that build passes both
    # /std:c++17 and /std:c11 to cl.exe, which MSVC 14.51 rejects (D8016).
    "grpcio-tools>=1.75.1,<2",
    "types-protobuf",
    "types-grpcio",
    # Release tooling: build the sdist/wheel and validate metadata locally, the
    # same steps the Release workflow runs before the gated publish.
    "build>=1.2",
    # hatchling 1.32 stamps Metadata 2.5 on the built distribution. twine
    # rejects a metadata version it does not know, and 7.0 is the first
    # release that knows 2.5, so `twine check` fails below it.
    "twine>=7.0",
    # Maintenance gates: pip-audit resolves the installed tree against the PyPI
    # and OSV advisory databases, griffe backs tools/apicheck.py.
    "pip-audit>=2.7",
    "griffe>=2.2,<3",
]
# Docs toolchain: MkDocs + Material, with mkdocstrings rendering the API
# reference straight from the wrapper layer's docstrings, and the snippets
# extension pulling runnable code out of docs/snippets/ so guide code can't
# drift from what actually executes. Read the Docs builds one copy per activated
# version and serves the version flyout itself, so nothing here drives that.
# Pinned to majors so a doc build is reproducible across releases without
# dragging in a breaking theme change unnoticed.
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
    "mkdocstrings[python]>=0.25,<1",
    "pymdown-extensions>=10.0",
]

[project.urls]
Documentation = "https://clappform.readthedocs.io"
Source = "https://github.com/ClappFormOrg/clappform-python"

[tool.hatch.version]
path = "src/clappform/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/clappform"]

[tool.ruff]
line-length = 99
target-version = "py310"
extend-exclude = [
    "src/clappform/gen",
    "src/clappform/services",
    "tests/servicegen_golden",
    # MkDocs build output: a copy of the source tree, not source to lint.
    "site",
]

[tool.ruff.lint]
# S is flake8-bandit: the checks that matter for a client library holding
# credentials, such as a hardcoded secret, a disabled TLS verification, eval on
# a server response, or an unpickled payload. C901 caps cyclomatic complexity
# per function.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S", "C901"]

[tool.ruff.lint.mccabe]
# Ruff's own default, stated here so the gate is visible next to the rule.
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Doc snippet sources deliberately re-import inside each function so that every
# fenced block the guides include reads as standalone, copy-pasteable code.
# That trips F811 (redefinition), which is expected here rather than a defect.
# S101: a snippet asserts to show the reader what a call returns.
"docs/snippets/*.py" = ["F811", "S101"]
# pytest rewrites `assert` to produce its diffs, so S101 has nothing to say
# about a test file.
"tests/**/*.py" = ["S101"]
# tools/ and the golden test invoke protoc from the dev environment's own
# grpcio-tools with argv this repo builds. S603 and S607 are about untrusted
# input reaching a shell, and there is none here.
"tools/*.py" = ["S603", "S607"]
"tests/test_servicegen_golden.py" = ["S603"]

[tool.mypy]
python_version = "3.10"
strict = false
check_untyped_defs = true
warn_unused_ignores = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "clappform.gen.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "clappform.services.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "pandas.*"
ignore_missing_imports = true

# Optional columnar deps: reserved for the server-gated Arrow read path, imported
# lazily and behind the [arrow]/[polars] extras. pyarrow ships no py.typed marker
# and polars may be absent entirely, so treat both like pandas above.
[[tool.mypy.overrides]]
module = ["pyarrow.*", "polars.*"]
ignore_missing_imports = true

# Pyright is not part of `make check`; mypy stays the gate. This section exists
# so that a pyright-langserver spawned by an editor or agent reports the same
# scope mypy does, rather than flagging the generated trees the gate ignores.
[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "standard"
include = ["src/clappform", "tools", "tests"]

# Not source: bytecode, the servicegen golden fixtures, and the MkDocs build
# output (a copy of the whole tree, so analysing it double-reports everything).
# Mirrors the "site" and "servicegen_golden" entries in extend-exclude above.
exclude = ["**/__pycache__", "site", "tests/servicegen_golden"]

# Generated code. `ignore` rather than `exclude` so these modules still resolve
# for the hand-written code that imports them, while their own diagnostics stay
# silent, the same split as ignore_errors in the mypy overrides above.
ignore = ["src/clappform/gen", "src/clappform/services"]

# pyarrow ships no py.typed marker and polars may be absent entirely; both sit
# behind the [arrow]/[polars] extras. Matches the ignore_missing_imports
# overrides for pandas, pyarrow and polars above.
reportMissingTypeStubs = "none"
reportMissingModuleSource = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["clappform"]
omit = [
    # Generated protobuf stubs and the generated service wrappers: mechanical,
    # covered by behaviour (test_generated_services) and golden (servicegen)
    # tests rather than per-method line coverage. Measuring them buries the
    # hand-written surface in a misleading aggregate.
    "src/clappform/gen/*",
    "src/clappform/services/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
# The hand-written surface sits ~97%; hold the line and fail loudly on a
# regression rather than letting new untested code slide in unnoticed.
fail_under = 90
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.$",
]
