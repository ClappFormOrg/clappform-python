[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clappform"
version = "6.0.0a0"
description = "Python client for the Clappform gRPC APIs"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Clappform B.V.", email = "info@clappform.com" },
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "grpcio>=1.60,<2",
    "protobuf>=4.25,<6",
]

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
polars = ["polars>=1.0"]
arrow = ["pyarrow>=15.0"]
all = ["clappform[pandas,polars,arrow]"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "grpcio-tools>=1.60,<2",
    "types-protobuf",
    "types-grpcio",
    # Release tooling: build the sdist/wheel and validate metadata locally, the
    # same steps the Release workflow runs before the gated publish.
    "build>=1.2",
    "twine>=5.0",
]
# Docs toolchain (§9): MkDocs + Material, with mkdocstrings rendering the API
# reference straight from the wrapper layer's docstrings, and the snippets
# extension pulling runnable code out of docs/snippets/ so guide code can't
# drift from what actually executes. mike drives the per-release version selector on
# Read the Docs. Pinned to majors so a doc build is reproducible across
# releases without dragging in a breaking theme change unnoticed.
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
    "mkdocstrings[python]>=0.25,<1",
    "pymdown-extensions>=10.0",
    "mike>=2.1,<3",
]

[project.urls]
Documentation = "https://clappform.readthedocs.io"
Source = "https://github.com/ClappFormOrg/clappform-python"

[tool.hatch.build.targets.wheel]
packages = ["src/clappform"]

[tool.ruff]
line-length = 99
target-version = "py310"
extend-exclude = [
    "src/clappform/gen",
    "src/clappform/services",
    "tests/servicegen_golden",
    # MkDocs build output — a copy of the source tree, not source to lint.
    "site",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Doc snippet sources deliberately re-import inside each function so that every
# fenced block the guides include reads as standalone, copy-pasteable code.
# That trips F811 (redefinition) — expected here, not a defect.
"docs/snippets/*.py" = ["F811"]

[tool.mypy]
python_version = "3.10"
strict = false
check_untyped_defs = true
warn_unused_ignores = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "clappform.gen.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "clappform.services.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "pandas.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["clappform"]
omit = [
    # Generated protobuf stubs and the generated service wrappers: mechanical,
    # covered by behaviour (test_generated_services) and golden (servicegen)
    # tests rather than per-method line coverage. Measuring them buries the
    # hand-written surface in a misleading aggregate.
    "src/clappform/gen/*",
    "src/clappform/services/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
# The hand-written surface sits ~97%; hold the line and fail loudly on a
# regression rather than letting new untested code slide in unnoticed.
fail_under = 90
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.$",
]
