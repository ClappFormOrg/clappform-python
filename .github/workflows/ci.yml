name: CI

on:
  push:
    branches: ["Major/6", "development", "main"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .[dev]
      - run: python -m ruff check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .[dev,pandas]
      - run: python -m mypy src/clappform tools

  apicheck:
    # Advisory. A major-version branch removes API on purpose, so this reports
    # what the diff does to the public surface and never blocks the merge; the
    # findings land as annotations on the changed files.
    if: github.event_name == 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # griffe reads the base ref from a temporary worktree, so the ref has to
      # exist locally. A PR checkout only brings the merge commit.
      - run: git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .[dev]
      - run: python tools/apicheck.py --against "origin/${{ github.base_ref }}" --format github

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          # Cache pip's downloads and built wheels. Versions without prebuilt
          # wheels for a dependency (currently 3.14 for grpcio/pandas/pyarrow)
          # compile from source on the first run; the cache means that ~5-12min
          # build is paid once, not on every run. Keyed on pyproject.toml, so
          # the cache busts when dependencies change.
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .[dev,pandas]
      # --cov enforces the fail_under gate in [tool.coverage.report] on every
      # PR (pull_request above has no branch filter, so this runs on all PRs).
      - run: python -m pytest -q --cov --cov-report=term-missing

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # pandas is needed so the docstring reference imports the DataFrame surface
      # and so the documented snippets run.
      - run: python -m pip install -e .[dev,docs,pandas]
      # Run every documented snippet against LocalMock. A guide example that
      # breaks fails here before the site is ever built.
      - run: python -m pytest -q tests/test_docs_snippets.py
      # Build the site with --strict so a broken snippet include, a dead
      # reference, or a nav typo fails the build rather than shipping silently.
      - run: python -m mkdocs build --strict
